<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>STUDIO MERZA</title>

    <link rel="stylesheet" href="pseudo.css">

</head>


<body>

    <main class="welcome-page">


        <!-- ANIMATION D'ARRIVÉE -->

        <div class="intro" id="intro">

            <div class="intro-name">
                STUDIO MERZA
            </div>

        </div>


        <!-- CONTENU -->

        <section class="welcome-content" id="welcome-content">

            <div class="logo">

                STUDIO
                <span>MERZA</span>

            </div>


            <p class="welcome-label">
                BIENVENUE AU STUDIO
            </p>


            <h1>
                Prêt à découvrir<br>
                quelque chose ?
            </h1>


            <p class="welcome-text">
                Entre ton pseudo pour commencer
                l'expérience STUDIO MERZA.
            </p>


            <!-- FORMULAIRE -->

            <form id="pseudo-form">

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="pseudo"
                        placeholder="Ton pseudo"
                        maxlength="20"
                        autocomplete="off"
                        required
                    >

                </div>


                <button type="submit">

                    Entrer dans le studio

                    <span>
                        →
                    </span>

                </button>

            </form>


            <p class="privacy-text">
                Aucun compte nécessaire.
            </p>

        </section>

    </main>


    <script src="pseudo.js"></script>

</body>

</html>
